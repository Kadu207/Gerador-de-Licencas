# Gerador de Licenças — Postgres dedicado + app
#   cp .env.example .env
#   .\tools\setup-db.ps1
#
# Postgres: 127.0.0.1:5436  |  App: http://127.0.0.1:8195

services:
  license-db:
    image: postgres:16-alpine
    container_name: licencas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: licencas
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Defina POSTGRES_APP_PASSWORD no arquivo .env}
      POSTGRES_DB: licencas_db
    volumes:
      - license_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licencas -d licencas_db"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  license-server:
    build: .
    container_name: gerador-licencas
    restart: unless-stopped
    depends_on:
      license-db:
        condition: service_healthy
    env_file: .env
    environment:
      LICENSE_SERVER_HOST: 0.0.0.0
      LICENSE_SERVER_PORT: 8195
      POSTGRES_HOST: license-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: licencas
      POSTGRES_DB: licencas_db
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      # LOCAL_DATABASE_URL é montada no entrypoint (senha URL-encoded, host license-db)
    ports:
      - "127.0.0.1:${LICENSE_SERVER_PORT:-8195}:8195"
    volumes:
      - license_data:/app/data

volumes:
  license_pg_data:
  license_data:
