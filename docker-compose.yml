# Gerador de Licenças — produção / VPS
# UI admin: https://licencas.inovatitech.com.br
# API produtos: https://licencas.inovatitech.com.br/api/v1/licenses/*
#
# Uso local com Postgres:
#   cp .env.example .env && docker compose up -d --build

services:
  license-db:
    image: postgres:16-alpine
    container_name: licencas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: licencas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licencas_dev_change_me}
      POSTGRES_DB: licencas_db
    volumes:
      - license_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licencas -d licencas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  license-server:
    build: .
    container_name: gerador-licencas
    restart: unless-stopped
    depends_on:
      license-db:
        condition: service_healthy
    env_file: .env
    environment:
      LICENSE_SERVER_HOST: 0.0.0.0
      LICENSE_SERVER_PORT: 8195
      LOCAL_DATABASE_URL: postgresql+psycopg://licencas:${POSTGRES_PASSWORD:-licencas_dev_change_me}@license-db:5432/licencas_db
    ports:
      - "127.0.0.1:${LICENSE_SERVER_PORT:-8195}:8195"
    volumes:
      - license_data:/app/data

volumes:
  license_pg_data:
  license_data:
