<!DOCTYPE html>
<html lang="pt-BR">
<head>
  {% include "_admin_head.html" %}
  <title>Login — Gerador de Licenças Inova TI</title>
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img src="/static/inova-ti-logo.jpg" alt="Inova TI" class="login-logo" width="40" height="40" />
        <h1>Gerador de Licenças</h1>
        <p class="login-subtitle">Inova TI · Acesso administrativo</p>
      </div>
      {% if error %}
      <div class="alert-error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/app/login">
        <div class="field">
          <label for="username">Usuário</label>
          <input id="username" name="username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>
      <p class="login-footer"><a href="/">← Voltar ao site</a></p>
    </div>
  </div>
</body>
</html>
