<aside class="admin-sidebar" data-sidebar aria-label="Menu principal">
  <div class="admin-sidebar__brand">
    <img src="/static/inova-ti-logo.jpg" alt="Inova TI" width="32" height="32" class="admin-sidebar__logo" />
    <div class="admin-sidebar__brand-text">
      <span class="admin-sidebar__title">Gerador de Licenças</span>
      <span class="admin-sidebar__sub">Inova TI</span>
    </div>
  </div>

  <nav class="admin-sidebar__nav">
    {% set path = request.url.path %}
    <a href="/dashboard" class="admin-sidebar__link{% if path == '/dashboard' %} is-active{% endif %}">
      <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="/clients" class="admin-sidebar__link{% if path.startswith('/clients') %} is-active{% endif %}">
      <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clientes
    </a>
    <a href="/admin/users" class="admin-sidebar__link{% if path.startswith('/admin/users') %} is-active{% endif %}">
      <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Administração
    </a>
  </nav>

  <div class="admin-sidebar__footer">
    <div class="admin-sidebar__user">
      <div class="admin-sidebar__avatar" aria-hidden="true">{{ (user.nome or user.username)[0]|upper }}</div>
      <div class="admin-sidebar__user-text">
        <span class="admin-sidebar__username">{{ user.nome or user.username }}</span>
        <span class="admin-sidebar__user-org">Inova TI</span>
      </div>
    </div>
    <a href="/logout" class="admin-sidebar__logout">
      <svg class="admin-sidebar__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </a>
  </div>
</aside>
<div class="admin-sidebar-backdrop" data-sidebar-backdrop hidden></div>
