# Nginx — proxy para gerador-licencas (porta host 8195)
# Em produção na VPS: montado no nginx Docker do Excellence (infra/nginx/licencas.inovatitech.com.br.conf)
# Standalone no host: copie para /etc/nginx/sites-available/ e ajuste upstream 127.0.0.1:8195

upstream gerador_licencas {
    server 127.0.0.1:8195;
    keepalive 8;
}

server {
    listen 80;
    server_name licencas.inovatitech.com.br;

    client_max_body_size 2m;

    location / {
        proxy_pass http://gerador_licencas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
