# Nginx — proxy para Next.js Gerenciador de Licenças (porta host 3000)
# FastAPI legado (profile legacy): 127.0.0.1:8195

upstream gerenciador_licencas_web {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    server_name licencas.inovatitech.com.br;

    client_max_body_size 2m;

    location / {
        proxy_pass http://gerenciador_licencas_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
