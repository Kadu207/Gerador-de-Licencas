# Nginx na VPS — /etc/nginx/sites-available/licencas.inovatitech.com.br
# sudo ln -s .../sites-available/licencas.inovatitech.com.br .../sites-enabled/
# sudo certbot --nginx -d licencas.inovatitech.com.br

upstream gerador_licencas {
    server 127.0.0.1:8195;
    keepalive 8;
}

server {
    listen 80;
    server_name licencas.inovatitech.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name licencas.inovatitech.com.br;

    # Certbot preenche estes paths; ou use Cloudflare Origin Certificate
    ssl_certificate     /etc/letsencrypt/live/licencas.inovatitech.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/licencas.inovatitech.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        proxy_pass http://gerador_licencas;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
